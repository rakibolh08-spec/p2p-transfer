<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

    <defs>

        <!-- Dangerous yellow glow -->
        <filter id="dangerGlow" x="-100%" y="-100%" width="300%" height="300%">

            <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>

            <feMerge>
                <feMergeNode in="blur"></feMergeNode>
                <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>

        </filter>

        <!-- Thunder gradient -->
        <linearGradient id="thunderGradient" x1="0" y1="0" x2="1" y2="1">

            <stop offset="0%" stop-color="#fff700"></stop>

            <stop offset="45%" stop-color="#ffd000"></stop>

            <stop offset="100%" stop-color="#ff6a00"></stop>

        </linearGradient>

        <!-- Dark background -->
        <radialGradient id="background" cx="50%" cy="45%" r="70%">

            <stop offset="0%" stop-color="#171717"></stop>

            <stop offset="65%" stop-color="#080808"></stop>

            <stop offset="100%" stop-color="#020202"></stop>

        </radialGradient>

    </defs>


    <!-- Dark rounded icon -->
    <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#background)" stroke="#292929" stroke-width="2"></rect>


    <!-- Subtle danger ring -->
    <circle cx="50" cy="50" r="36" fill="none" stroke="#ffb700" stroke-opacity="0.12" stroke-width="2"></circle>


    <!-- Main dangerous thunder -->
    <path d="
        M61 7
        L20 51
        L43 51
        L35 67
        L53 61
        L43 94
        L81 43
        L57 43
        L66 27
        L50 34
        Z
        " fill="url(#thunderGradient)" filter="url(#dangerGlow)" stroke="#fff200" stroke-width="1.5" stroke-linejoin="miter"></path>


    <!-- Sharp inner highlight -->
    <path d="
        M59 17
        L29 49
        L48 49
        L42 59
        L55 55
        L49 80
        L71 47
        L52 47
        L60 32
        L52 36
        Z
        " fill="#fff700" opacity="0.9"></path>


    <!-- Small electric sparks -->
    <path d="M16 28 L22 24 L19 33 Z" fill="#ffd000" filter="url(#dangerGlow)"></path>

    <path d="M79 69 L86 64 L83 74 Z" fill="#ff8a00" filter="url(#dangerGlow)"></path>

</svg>